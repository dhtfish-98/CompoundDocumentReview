[build-system]
requires = ["setuptools==82.0.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "compound-document-review"
version = "0.1.1"
description = "Bounded offline read-only CFB allocation and directory structure review"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-2-Clause"
license-files = ["LICENSE", "NOTICE", "licenses/*.txt"]
authors = [{name = "dhtfish98"}]
dependencies = []

[project.scripts]
compound-document-review = "compound_document_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
compound_document_review = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
